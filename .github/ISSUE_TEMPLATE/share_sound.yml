name: Share a preset, kit or template
description: Propose a synth preset, drum kit or starting template for everyone
labels: [content]
body:
  - type: markdown
    attributes:
      value: Sounds and templates are some of the best first contributions. Share the code here, or open a pull request directly (see CONTRIBUTING.md).
  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options: [Synth preset, Drum kit, Starting template, Song or example]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: warm-reese
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The track or song as Tactus code (copy it from the Code workspace).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: The genre, how to use it, and a link to an audio clip if you have one.
