version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      build-tools:
        patterns: ['vite', 'vitest', 'typescript', 'electron', 'electron-builder', 'esbuild', '@vitejs/*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
