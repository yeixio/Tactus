name: Branch cleanup

# Deletes branches whose pull request is finished. It runs when a pull request
# closes, and Run workflow under Actions → Branch cleanup sweeps the whole
# repository.
#
# A branch is deleted only when all of this is true: it isn't the default
# branch, it has no open pull request, its newest pull request is closed
# (merged or not), and the branch hasn't moved since that pull request closed.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # A pull request from a fork has its branch in the fork, not here.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete finished branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          gh api --paginate "repos/$repo/branches" --jq '.[] | select(.protected | not) | "\(.name) \(.commit.sha)"' |
          while read -r branch sha; do
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            open="$(gh api -X GET "repos/$repo/pulls" -f state=open -f head="$owner:$branch" --jq length)"
            if [ "$open" != 0 ]; then
              echo "Kept $branch: it has an open pull request."
              continue
            fi
            last="$(gh api -X GET "repos/$repo/pulls" -f state=closed -f head="$owner:$branch" -f sort=updated -f direction=desc -f per_page=1 --jq '.[0].head.sha // ""')"
            if [ -z "$last" ]; then
              echo "Kept $branch: it never had a pull request."
            elif [ "$last" != "$sha" ]; then
              echo "Kept $branch: it has commits newer than its last pull request."
            else
              gh api -X DELETE "repos/$repo/git/refs/heads/$branch" --silent
              echo "Deleted $branch."
            fi
          done
